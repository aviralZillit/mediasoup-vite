<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaSoup Rooms Inspector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            color: #2c3e50;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header .subtitle {
            color: #7f8c8d;
            font-size: 1.1em;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #3498db;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #7f8c8d;
            font-size: 0.9em;
        }

        .rooms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .room-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .room-card:hover {
            transform: translateY(-5px);
        }

        .room-header {
            background: #34495e;
            color: white;
            padding: 20px;
            position: relative;
        }

        .room-id {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 5px;
            word-break: break-all;
        }

        .room-uptime {
            font-size: 0.9em;
            opacity: 0.8;
        }

        .status-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #27ae60;
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8em;
        }

        .room-content {
            padding: 20px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .metric-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .metric-label {
            color: #7f8c8d;
            font-size: 0.9em;
        }

        .metric-value {
            color: #2c3e50;
            font-weight: bold;
        }

        .peers-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #ecf0f1;
        }

        .peers-title {
            color: #2c3e50;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .peer-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .peer-badge {
            background: #3498db;
            color: white;
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 0.8em;
        }

        .peer-badge.producer {
            background: #27ae60;
        }

        .peer-badge.consumer {
            background: #e74c3c;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #7f8c8d;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .empty-state h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }

        .error {
            background: #fdeaea;
            color: #e74c3c;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }

        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #3498db;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 50%;
            font-size: 1.2em;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
            transition: all 0.3s ease;
            width: 60px;
            height: 60px;
        }

        .refresh-btn:hover {
            background: #2980b9;
            transform: scale(1.1);
        }

        @media (max-width: 768px) {
            .rooms-grid {
                grid-template-columns: 1fr;
            }
            
            .metrics-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav style="background: rgba(255, 255, 255, 0.95); padding: 15px 25px; border-radius: 10px; margin: 20px auto; max-width: 1400px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div style="display: flex; align-items: center; gap: 20px;">
                <a href="/dashboard" style="text-decoration: none; color: #3498db; font-weight: bold; font-size: 1.1em;">🏠 Dashboard Home</a>
                <span style="color: #bdc3c7;">|</span>
                <span style="color: #2c3e50; font-weight: bold;">🏠 Rooms Inspector</span>
            </div>
            <div style="display: flex; gap: 15px;">
                <a href="/dashboard/calls" style="text-decoration: none; color: #8e44ad; padding: 8px 15px; background: #f4ecf7; border-radius: 5px; font-size: 0.9em;">📞 Call Monitor</a>
                <a href="/analytics/server" target="_blank" style="text-decoration: none; color: #27ae60; padding: 8px 15px; background: #d5f4e6; border-radius: 5px; font-size: 0.9em;">📊 Server Stats</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="header">
            <h1>🏠 Rooms Inspector</h1>
            <p class="subtitle">Live MediaSoup rooms with real-time peer and media analytics</p>
        </div>

        <div class="stats-bar" id="statsBar">
            <div class="stat-card">
                <div class="stat-number" id="totalRooms">-</div>
                <div class="stat-label">Active Rooms</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalPeers">-</div>
                <div class="stat-label">Total Peers</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalProducers">-</div>
                <div class="stat-label">Total Producers</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalConsumers">-</div>
                <div class="stat-label">Total Consumers</div>
            </div>
        </div>

        <div class="rooms-grid" id="roomsGrid">
            <div class="loading">Loading rooms...</div>
        </div>
    </div>

    <button class="refresh-btn" onclick="loadRooms()" title="Refresh Rooms">
        🔄
    </button>

    <script>
        let refreshInterval;
        const API_BASE = window.location.origin;

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadRooms();
            // Auto-refresh every 10 seconds
            refreshInterval = setInterval(loadRooms, 10000);
        });

        async function loadRooms() {
            try {
                const response = await fetch(`${API_BASE}/dashboard/rooms`);
                const data = await response.json();

                if (data.success) {
                    updateStats(data);
                    displayRooms(data.rooms);
                } else {
                    showError(data.error || 'Failed to load rooms');
                }
            } catch (error) {
                console.error('Failed to load rooms:', error);
                showError('Failed to connect to server');
            }
        }

        function updateStats(data) {
            document.getElementById('totalRooms').textContent = data.totalRooms;
            
            let totalPeers = 0;
            let totalProducers = 0;
            let totalConsumers = 0;
            
            data.rooms.forEach(room => {
                totalPeers += room.peersCount;
                totalProducers += room.producers;
                totalConsumers += room.consumers;
            });
            
            document.getElementById('totalPeers').textContent = totalPeers;
            document.getElementById('totalProducers').textContent = totalProducers;
            document.getElementById('totalConsumers').textContent = totalConsumers;
        }

        function displayRooms(rooms) {
            const container = document.getElementById('roomsGrid');
            
            if (!rooms || rooms.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>🏠 No Active Rooms</h3>
                        <p>No MediaSoup rooms are currently active on the server.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = rooms.map(room => `
                <div class="room-card">
                    <div class="room-header">
                        <div class="room-id">${room.roomId}</div>
                        <div class="room-uptime">Uptime: ${formatDuration(room.uptime)}</div>
                        <div class="status-badge">Active</div>
                    </div>
                    <div class="room-content">
                        <div class="metrics-grid">
                            <div class="metric-item">
                                <span class="metric-label">👥 Current Peers</span>
                                <span class="metric-value">${room.peersCount}</span>
                            </div>
                            <div class="metric-item">
                                <span class="metric-label">📊 Total Joined</span>
                                <span class="metric-value">${room.totalPeers}</span>
                            </div>
                            <div class="metric-item">
                                <span class="metric-label">🎤 Producers</span>
                                <span class="metric-value">${room.producers}</span>
                            </div>
                            <div class="metric-item">
                                <span class="metric-label">🔊 Consumers</span>
                                <span class="metric-value">${room.consumers}</span>
                            </div>
                            <div class="metric-item">
                                <span class="metric-label">📈 Data Transfer</span>
                                <span class="metric-value">${formatBytes(room.dataTransfer)}</span>
                            </div>
                            <div class="metric-item">
                                <span class="metric-label">⚠️ Recent Errors</span>
                                <span class="metric-value ${room.recentErrors > 0 ? 'error' : ''}">${room.recentErrors}</span>
                            </div>
                        </div>
                        <div style="text-align: center; margin-top: 15px;">
                            <button onclick="inspectRoom('${room.roomId}')" 
                                style="background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 0.9em;">
                                🔍 Inspect Room
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function inspectRoom(roomId) {
            try {
                const response = await fetch(`${API_BASE}/dashboard/rooms/${roomId}`);
                const data = await response.json();

                if (data.success) {
                    showRoomDetails(data.room);
                } else {
                    alert('Failed to inspect room: ' + data.error);
                }
            } catch (error) {
                alert('Failed to inspect room: ' + error.message);
            }
        }

        function showRoomDetails(room) {
            const modalContent = `
                <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center;" onclick="this.remove()">
                    <div style="background: white; padding: 30px; border-radius: 15px; max-width: 800px; max-height: 80vh; overflow-y: auto; width: 90%;" onclick="event.stopPropagation()">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                            <h2 style="color: #2c3e50;">🏠 Room: ${room.roomId}</h2>
                            <button onclick="this.closest('[style*=\"position: fixed\"]').remove()" style="background: #e74c3c; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer;">✕</button>
                        </div>
                        
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px;">
                            <div style="background: #f8f9fa; padding: 15px; border-radius: 8px;">
                                <strong>Uptime:</strong> ${formatDuration(room.analytics.uptime)}
                            </div>
                            <div style="background: #f8f9fa; padding: 15px; border-radius: 8px;">
                                <strong>Current Peers:</strong> ${room.analytics.currentPeers}
                            </div>
                            <div style="background: #f8f9fa; padding: 15px; border-radius: 8px;">
                                <strong>Total Joined:</strong> ${room.analytics.totalPeersJoined}
                            </div>
                            <div style="background: #f8f9fa; padding: 15px; border-radius: 8px;">
                                <strong>Data Transferred:</strong> ${formatBytes(room.analytics.dataTransferred)}
                            </div>
                        </div>

                        <h3 style="color: #2c3e50; margin-bottom: 15px;">👥 Active Peers</h3>
                        ${room.peers.length > 0 ? room.peers.map(peer => `
                            <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 10px;">
                                <div style="display: flex; justify-content: space-between; align-items: start;">
                                    <div>
                                        <strong>${peer.displayName}</strong><br>
                                        <small style="color: #7f8c8d;">ID: ${peer.id}</small>
                                    </div>
                                    <div style="text-align: right;">
                                        <div>🎤 Producers: ${peer.producers.join(', ') || 'None'}</div>
                                        <div>🔊 Consumers: ${peer.consumers.join(', ') || 'None'}</div>
                                        <div>🔗 Transports: ${peer.transports}</div>
                                    </div>
                                </div>
                            </div>
                        `).join('') : '<p style="color: #7f8c8d; text-align: center; padding: 20px;">No active peers</p>'}

                        ${room.analytics.recentErrors.length > 0 ? `
                            <h3 style="color: #e74c3c; margin: 20px 0 15px 0;">⚠️ Recent Errors</h3>
                            <div style="background: #fdeaea; padding: 15px; border-radius: 8px; max-height: 200px; overflow-y: auto;">
                                ${room.analytics.recentErrors.map(error => `
                                    <div style="margin-bottom: 10px; padding: 8px; background: white; border-radius: 4px;">
                                        <strong>${error.type}:</strong> ${error.message}<br>
                                        <small style="color: #7f8c8d;">${new Date(error.timestamp).toLocaleString()}</small>
                                    </div>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
            
            document.body.insertAdjacentHTML('beforeend', modalContent);
        }

        function formatDuration(ms) {
            if (!ms || ms < 0) return '0s';
            
            const seconds = Math.floor(ms / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);

            if (days > 0) return `${days}d ${hours % 24}h`;
            if (hours > 0) return `${hours}h ${minutes % 60}m`;
            if (minutes > 0) return `${minutes}m ${seconds % 60}s`;
            return `${seconds}s`;
        }

        function formatBytes(bytes) {
            if (!bytes || bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function showError(message) {
            const container = document.getElementById('roomsGrid');
            container.innerHTML = `
                <div class="error">
                    <h3>❌ Error</h3>
                    <p>${message}</p>
                    <button onclick="loadRooms()" style="margin-top: 10px; background: #3498db; color: white; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer;">
                        Retry
                    </button>
                </div>
            `;
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', function() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
        });
    </script>
</body>
</html>
